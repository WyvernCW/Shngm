name: Build iOS (IPA & DEB)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build iOS Application
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Build iOS Archive (Unsigned)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $PWD/build/App.xcarchive \
            clean archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO
      
      - name: Package IPA (Unsigned)
        run: |
          cd ios/App/build/App.xcarchive/Products/Applications
          mkdir Payload
          cp -r App.app Payload/
          zip -r ../../../../../Shngm.ipa Payload
          
      - name: Install dpkg (For DEB packaging)
        run: brew install dpkg
        
      - name: Package DEB (For Jailbreak)
        run: |
          mkdir -p deb/Applications
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app deb/Applications/Shngm.app
          mkdir -p deb/DEBIAN
          cat <<EOF > deb/DEBIAN/control
          Package: id.shngm.app
          Name: Shinigami
          Version: 1.0.0
          Architecture: iphoneos-arm
          Description: Premium Manga Reader
          Author: Biman
          Maintainer: Biman
          Section: Applications
          EOF
          dpkg-deb -b deb Shngm.deb

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shngm-IPA
          path: ios/App/Shngm.ipa
          
      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shngm-DEB
          path: Shngm.deb
